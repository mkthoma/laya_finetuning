[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "laya-poc"
version = "0.1.0"
description = "Laya record-normalisation PoC: FSQ data pipeline, single-GPU fine-tuning port, smoke test"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "pyarrow>=14",
    "pyyaml>=6",
    "scikit-learn>=1.3",
    "scipy>=1.10",
]

[project.optional-dependencies]
data = ["duckdb>=1.1", "huggingface_hub>=0.20"]
dev = ["pytest>=8", "pytest-cov>=5", "nbformat>=5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
addopts = "-q"
markers = [
    "torch: needs torch installed (skipped otherwise)",
]

[tool.coverage.run]
source = ["laya_poc"]
omit = [
    # GPU / Colab-only entry points, exercised by the smoke notebook itself
    "*/laya_poc/train_single.py",
    "*/laya_poc/parity.py",
    "*/laya_poc/zeroshot.py",
    "*/laya_poc/env_check.py",
]
